[project]
name = "manifold"
version = "0.1.0"
description = "Mechanistic interpretability with native PyTorch hooks."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "torch>=2.4.0",
    "transformers>=4.45",
    "pyyaml>=6.0",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["manifold"]

[project.scripts]
manifold = "cli:app"